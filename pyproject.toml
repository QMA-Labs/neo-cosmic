[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-core"
version = "1.2.0"
description = "NEO local-first desktop companion for Linux and Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "PySide6>=6.8,<7",
  "mss>=10,<11",
  "Pillow>=11,<13",
  "cryptography>=44,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "black>=24,<26",
]

[project.scripts]
neo = "neo.cli:main"
neo-pet = "neo.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
