name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build and test
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NEO-DRIVE-WINDOWS-X64
          path: |
            dist/NEO-DRIVE-WINDOWS-X64.zip
            dist/NEO-DRIVE-WINDOWS-X64.zip.sha256
          if-no-files-found: error
